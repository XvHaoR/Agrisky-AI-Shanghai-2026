version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGRISKY_DB_PATH: /app/data/agrisky.db
      AGRISKY_OUTPUT_ROOT: /app/outputs
      AGRISKY_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AGRISKY_ALLOW_MOCK_REMOTE_SENSING: ${AGRISKY_ALLOW_MOCK_REMOTE_SENSING:-false}
      AGRISKY_REQUIRE_CLAIM_DOCUMENTS: ${AGRISKY_REQUIRE_CLAIM_DOCUMENTS:-false}
      AGRISKY_DOCUMENT_MAX_BYTES: ${AGRISKY_DOCUMENT_MAX_BYTES:-20971520}
      AGRISKY_DOCUMENT_MAX_PAGES: ${AGRISKY_DOCUMENT_MAX_PAGES:-60}
      AGRISKY_AUTH_ENABLED: ${AGRISKY_AUTH_ENABLED:-true}
      AGRISKY_SESSION_MAX_AGE_SECONDS: ${AGRISKY_SESSION_MAX_AGE_SECONDS:-28800}
      AGRISKY_COOKIE_SECURE: ${AGRISKY_COOKIE_SECURE:-false}
      AGRISKY_LOGIN_ACCOUNT_MAX_FAILURES: ${AGRISKY_LOGIN_ACCOUNT_MAX_FAILURES:-5}
      AGRISKY_LOGIN_IP_MAX_FAILURES: ${AGRISKY_LOGIN_IP_MAX_FAILURES:-25}
      AGRISKY_LOGIN_WINDOW_SECONDS: ${AGRISKY_LOGIN_WINDOW_SECONDS:-300}
      AGRISKY_LOGIN_BLOCK_SECONDS: ${AGRISKY_LOGIN_BLOCK_SECONDS:-900}
      AGRISKY_LOGIN_RATE_MAX_KEYS: ${AGRISKY_LOGIN_RATE_MAX_KEYS:-10000}
      AGRISKY_BOOTSTRAP_ADMIN_USERNAME: ${AGRISKY_BOOTSTRAP_ADMIN_USERNAME:-}
      AGRISKY_BOOTSTRAP_ADMIN_PASSWORD: ${AGRISKY_BOOTSTRAP_ADMIN_PASSWORD:-}
      AGRISKY_BOOTSTRAP_ADMIN_NAME: ${AGRISKY_BOOTSTRAP_ADMIN_NAME:-}
      AGRISKY_SEED_DEMO_ACCOUNTS: ${AGRISKY_SEED_DEMO_ACCOUNTS:-false}
      AGRISKY_SEED_DEMO_DATA: ${AGRISKY_SEED_DEMO_DATA:-false}
      AGRISKY_API_KEYS: ${AGRISKY_API_KEYS:-}
      AGRISKY_AGENT_API_KEY: ${AGRISKY_AGENT_API_KEY:-}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-your-earth-engine-project-id}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-openai_compatible}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-https://api.deepseek.com}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-v4-pro}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-10}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs

  web:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
